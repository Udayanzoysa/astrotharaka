# Upstream apps (Docker network service names)
upstream taraka_web {
  server web:3001;
}

upstream taraka_api {
  server api:3000;
}

# Redirect www → apex
server {
  listen 80;
  server_name www.astrotharaka.com;
  return 301 https://astrotharaka.com$request_uri;
}

# HTTP → HTTPS (+ ACME challenge)
server {
  listen 80;
  server_name astrotharaka.com api.astrotharaka.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---- Main site (Next.js) ----
server {
  listen 443 ssl http2;
  server_name astrotharaka.com;

  ssl_certificate     /etc/letsencrypt/live/astrotharaka.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/astrotharaka.com/privkey.pem;
  include /etc/nginx/snippets/ssl-params.conf;

  location / {
    proxy_pass http://taraka_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# ---- API (NestJS) ----
server {
  listen 443 ssl http2;
  server_name api.astrotharaka.com;

  ssl_certificate     /etc/letsencrypt/live/astrotharaka.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/astrotharaka.com/privkey.pem;
  include /etc/nginx/snippets/ssl-params.conf;

  location / {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://taraka_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # PayHere / uploads
    proxy_read_timeout 120s;
  }
}
