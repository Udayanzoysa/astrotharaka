# Temporary HTTP-only host config (before SSL certs exist).
# sudo cp deploy/nginx/host/astrotharaka.http-bootstrap.conf /etc/nginx/sites-available/astrotharaka.conf
# sudo ln -sf /etc/nginx/sites-available/astrotharaka.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# Then:
#   sudo certbot --nginx -d astrotharaka.com -d www.astrotharaka.com -d api.astrotharaka.com
# Then replace with deploy/nginx/host/astrotharaka.conf (or let certbot edit the file).

server {
  listen 80;
  listen [::]:80;
  server_name www.astrotharaka.com;
  return 301 http://astrotharaka.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name astrotharaka.com;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name api.astrotharaka.com;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
