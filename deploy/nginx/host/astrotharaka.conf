# Install on the VPS host (system nginx), NOT inside Docker:
#   sudo cp deploy/nginx/host/astrotharaka.conf /etc/nginx/sites-available/astrotharaka.conf
#   sudo ln -sf /etc/nginx/sites-available/astrotharaka.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Docker publishes:
#   web → 127.0.0.1:3001
#   api → 127.0.0.1:3000
# Other app stays on :8080 (unchanged).

# Redirect www → apex
server {
  listen 80;
  listen [::]:80;
  server_name www.astrotharaka.com;
  return 301 https://astrotharaka.com$request_uri;
}

# HTTP → HTTPS + ACME
server {
  listen 80;
  listen [::]:80;
  server_name astrotharaka.com api.astrotharaka.com;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---- Main site (Next.js) ----
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name astrotharaka.com;

  # After: certbot --nginx -d astrotharaka.com -d www.astrotharaka.com -d api.astrotharaka.com
  ssl_certificate     /etc/letsencrypt/live/astrotharaka.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/astrotharaka.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 25m;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# ---- API ----
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.astrotharaka.com;

  ssl_certificate     /etc/letsencrypt/live/astrotharaka.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/astrotharaka.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 25m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
